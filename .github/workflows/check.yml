# bin/check on every push and pull request: the shipping greps, ruff and
# the synthetic-dataset test, in the desktop CPU venv.
name: check
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no major tags since v8
      - run: uv python install 3.13.2
      - id: venv
        uses: actions/cache@v6
        with:
          path: ~/.venvs/iris-imaging
          # The venv links to the interpreter by path, so the key names where
          # setup-uv puts it; a cached venv from another location is dangling.
          key: venv-${{ runner.os }}-${{ hashFiles('envs/imaging/requirements.lock', 'envs/imaging/desktop.sh') }}-${{ env.UV_PYTHON_INSTALL_DIR }}
      - run: ~/.venvs/iris-imaging/bin/python -c '' 2>/dev/null || envs/imaging/desktop.sh
      - run: bin/check
