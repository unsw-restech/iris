# The imaging environment image (ADR-0004): built from envs/imaging/Dockerfile
# on any change to its recipe, checked against the lock, then published to
# ghcr.io/unsw-restech/iris-imaging, tagged with its commit. A build becomes a
# version only when its digest goes into envs/imaging/images.txt; the
# README there covers how.
name: image
on:
  push:
    paths:
      - envs/imaging/Dockerfile
      - envs/imaging/requirements.lock
      - envs/imaging/check_imports.py
      - envs/imaging/check-image.sh
      - .github/workflows/image.yml
  # Branches in this repo already build on push; this covers forks, whose
  # builds are checked but never published.
  pull_request:
    paths:
      - envs/imaging/Dockerfile
      - envs/imaging/requirements.lock
      - envs/imaging/check_imports.py
      - envs/imaging/check-image.sh
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/unsw-restech/iris-imaging:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      # The image is about 9 GB unpacked; the runner starts with less free.
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - run: docker build --build-arg COMMIT=${{ github.sha }} -t "$IMAGE" envs/imaging
      - run: docker image ls "$IMAGE"
      - run: sudo apt-get update -q && sudo apt-get install -yq xvfb
      - run: |
          Xvfb :99 -ac -screen 0 1280x1024x24 &
          sleep 2
          DISPLAY=:99 envs/imaging/check-image.sh "$IMAGE"
      - if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
          ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "Published $ref"
          echo "Published \`$ref\`. To make it version <n>, add \`<n> $ref\` to envs/imaging/images.txt." >> "$GITHUB_STEP_SUMMARY"
