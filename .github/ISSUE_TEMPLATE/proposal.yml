# A workflow author's proposal, filed before building something only the
# maintainer can give: new packages, a new modality or lab, or adopting an
# unmaintained workflow. Any other workflow needs no proposal; its pull
# request is the only approval. The maintainer approves with the approved
# label, or declines by closing with wontfix, against the fit criteria on the
# contribute page, which the form links rather than copies.
name: Propose a workflow
description: Ask for new packages, a new modality or lab, or to adopt an unmaintained workflow, before you build.
title: "Proposal: "
labels: [proposal]
body:
  - type: markdown
    attributes:
      value: |
        **Proposals open at launch.** Until IRIS opens to researchers, please don't file one yet.

        You need a proposal only for something only the maintainer can give: **new packages**, a **new modality or lab**, or **adopting an unmaintained workflow**. Any other workflow needs none: build it on a fork and open a pull request, which is where it is approved. The [contribute page](https://docs.restech.unsw.edu.au/iris/contribute/#proposal) explains.

        Check your workflow meets the [fit criteria](https://docs.restech.unsw.edu.au/iris/contribute/#criteria) first. The maintainer approves with the `approved` label or declines by closing this issue as `wontfix`, and you get that answer here before you build what it asks for.
  - type: dropdown
    id: asking-for
    attributes:
      label: What you're asking for
      description: Choose every one that applies.
      multiple: true
      options:
        - New packages, or packages at other versions
        - A new modality
        - A new lab
        - Adopting an unmaintained workflow
    validations:
      required: true
  - type: dropdown
    id: lab
    attributes:
      label: Lab
      description: The imaging facility or research group the workflow serves, which is its section of the catalogue. Choose "New lab" to ask the maintainer to add one, and name it below; the maintainer builds a new lab's first environment from this proposal, unless it uses an existing lab's.
      options:
        - X-ray MicroCT Lab
        - BRIL
        - New lab (needs the maintainer's OK)
    validations:
      required: true
  - type: input
    id: new-lab
    attributes:
      label: New lab
      description: Only if you chose "New lab" above. Say whether it needs packages of its own or can use an existing lab's environment.
  - type: dropdown
    id: modality
    attributes:
      label: Modality
      description: The imaging technique the workflow serves. Choose "New modality" to ask the maintainer to add one, and name it below.
      options:
        - microCT
        - MRI
        - New modality (needs the maintainer's OK)
    validations:
      required: true
  - type: input
    id: new-modality
    attributes:
      label: New modality
      description: Only if you chose "New modality" above.
  - type: textarea
    id: what-it-does
    attributes:
      label: What the workflow does
      description: What a researcher gives it, what it runs, and what they get back in the run directory. To adopt an unmaintained workflow, name it and say what you'll fix.
    validations:
      required: true
  - type: textarea
    id: dataset-layout
    attributes:
      label: Input dataset layout
      description: The one dataset folder the workflow reads from the researcher's scratch, in the layout its page will document and its form's `check:` will validate.
      render: text
    validations:
      required: true
  - type: textarea
    id: packages
    attributes:
      label: Packages beyond the lab's environment
      description: Packages and versions the workflow needs that its lab's environment doesn't have, or has at other versions (`envs/core.in` and `envs/<env>/requirements.in`). Write "None" if it needs nothing new.
    validations:
      required: true
  - type: textarea
    id: compute
    attributes:
      label: Compute needs
      description: CPU or GPU, memory and walltime for a typical dataset, and how you measured them.
      placeholder: |
        GPU (any model), 8 CPUs, 64 GB, 4 hours, from a run on a 16 GB volume
    validations:
      required: true
  - type: textarea
    id: owner
    attributes:
      label: Workflow owner and co-authors
      description: The proposed workflow owner (name, zID, GitHub username), then any co-authors to credit on its DOI. Give ORCIDs if you have them.
      placeholder: |
        Owner: Jane Citizen, z1234567, @janecitizen, https://orcid.org/0000-0000-0000-0000
        Co-authors: ...
    validations:
      required: true
